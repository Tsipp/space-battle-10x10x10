<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>🎮 Админ — Космический бой</title>
  <link rel="stylesheet" href="/static/shared/theme.css">
  <link rel="stylesheet" href="/static/admin/admin.css">
</head>
<body>
<header class="topbar">
  <div class="title">
    <h1>🎮 Админ-панель</h1>
    <span class="sub">Космический бой 10×10×10</span>
  </div>
  <div class="row" id="auth-status">
    <span class="small muted" id="auth-label">Не авторизован</span>
    <button id="btn-logout" class="hidden">Выйти</button>
  </div>
</header>

<main class="page stack">

  <!-- LOGIN -->
  <section class="panel" id="login-panel">
    <h2>Вход администратора</h2>
    <p class="muted small">Пароль задаётся переменной окружения <code>GM_PASSWORD</code>. В dev-режиме по умолчанию — <code>admin</code>.</p>
    <form id="login-form" class="row">
      <input type="password" id="password" placeholder="Пароль" autocomplete="current-password">
      <button class="primary" type="submit">Войти</button>
      <span id="login-err" class="notice hidden"></span>
    </form>
  </section>

  <!-- GAMES LIST -->
  <section class="panel hidden stack" id="games-panel">
    <div class="row">
      <h2 class="grow">Список игр</h2>
      <button class="primary" id="btn-create">+ Новая игра</button>
      <button id="btn-refresh">Обновить</button>
    </div>
    <div id="games-list" class="stack"></div>
  </section>

  <!-- MONITOR -->
  <section class="panel hidden stack" id="monitor-panel">
    <div class="row">
      <h2 class="grow">Монитор игры <span id="mon-gid" class="muted small"></span></h2>
      <button id="btn-back">← К списку</button>
      <button id="btn-force-start" class="primary hidden">▶ Старт вручную</button>
      <button id="btn-force-turn" class="hidden">⏭ Завершить ход</button>
    </div>

    <div class="row">
      <div class="card grow">
        <div class="row">
          <span class="small">Фаза:</span>
          <strong id="mon-phase">—</strong>
          <span class="small">Ход:</span>
          <strong id="mon-turn">0</strong>
          <span class="small">Игроков:</span>
          <strong id="mon-players">0</strong>
          <span class="small">Таймер планирования:</span>
          <strong id="mon-deadline">—</strong>
        </div>
      </div>
      <div class="card">
        <div class="small muted">Ссылки</div>
        <div class="row" id="mon-links"></div>
      </div>
    </div>

    <div id="mon-teams" class="stack"></div>

    <div class="panel" style="max-height: 420px; overflow-y: auto;">
      <h3>Журнал</h3>
      <div id="mon-log" class="stack small"></div>
    </div>
  </section>
</main>

<script type="module" src="/static/admin/admin.js"></script>
</body>
</html>
